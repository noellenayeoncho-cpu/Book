<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">

    <title>Discover</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <nav class="navigation">

        <a href="index.html" class="nav-button">
            <img src="images/home.png" alt="Home">
            <span>Home</span>
        </a>

        <a href="discover.html" class="nav-button">
            <img src="images/discover.png" alt="Discover">
            <span>Discover</span>
        </a>

        <a href="wishlist.html" class="nav-button">
            <img src="images/wishlist.png" alt="Wishlist">
            <span>Wishlist</span>
        </a>

        <a href="shelf.html" class="nav-button">
            <img src="images/shelf.png" alt="shelf">
            <span>Shelf</span>
        </a>

        <a href="read.html" class="nav-button">
            <img src="images/read.png" alt="Finished">
            <span>Read</span>
        </a>

    </nav>

    <main>

        <section class="discover">

            <div class="discover-text">
                <h1>Discover Books</h1>
            </div>

            <div class="search-bar">
                <input
                    type="text"
                    id="bookSearch"
                    placeholder="Search for a book..."
                >

                <button onclick="searchBooks()" class="search-button">
                    <img src="images/search.png" alt="Search">
                </button>
            </div>

            <div id="results" class="book-container"></div>

        </section>

    </main>

    <div id="bookModal" class="book-modal">

        <div class="book-modal-content">

            <button class="close-modal" onclick="closeBookModal()">×</button>

            <img id="modalImage" src="" alt="Book cover">

            <div class="modal-text">
                <h2 id="modalTitle"></h2>
                <p id="modalSummary"></p>

                <button id="modalAddButton" class="add-wishlist">
                    + Add to Wishlist
                </button>
            </div>

        </div>

    </div>
    <div id="notification" class="notification">
    <span id="notificationMessage"></span>
</div>

</body>
</html>
